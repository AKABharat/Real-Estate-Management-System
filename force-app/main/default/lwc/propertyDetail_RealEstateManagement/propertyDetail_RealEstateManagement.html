<template>
        <lightning-spinner if:true={showSpinner}  style="position: fixed;" alternative-text="Loading" variant="brand"></lightning-spinner>
    
    <div style="background: linear-gradient(0deg, rgb(133 121 255) 2%, rgba(0, 0, 0, 0) 74%);margin-top: 0.57rem;">
    <div> 
        <div class="propertyTitle">
            {property.Title}
        </div>       
        <lightning-carousel>
            <template if:true={property.images}>
                <template for:each={property.images} for:item="image">
                    <lightning-carousel-image style="width:100vw;height:55rem" key={image} src={image} alternative-text="Property Image"></lightning-carousel-image>
                </template>
            </template>
        </lightning-carousel>
        <div class="proDescription">
            {property.propertyDescription}
        </div>

        <div class="downloadpdf">
            <h1 style="margin-right: 0.5rem;     color: #2574A9;">Download Property</h1>
            <lightning-button
                label="Details"
                variant="brand-outline" 
                icon-name="utility:download"
                onclick={handleGeneratePDF} 
            ></lightning-button>
        </div>

        <div class="featureHead" style="margin-left: 2rem">
            Key highlights 
        </div>
        <div class="amenities">
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12201">{property.area} sq.ft.</span><span class="amenities__item__text ellipsis">
                Area </span>
            </div>
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12205">{property.BHK}</span> <span class="amenities__item__text ellipsis">
                BHK </span>
            </div>
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12202">{property.floor}</span> <span class="amenities__item__text ellipsis">
                floor </span>
            </div>
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12209">{property.type}</span> <span class="amenities__item__text ellipsis">
                Type</span>
            </div>
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12209">{property.parking}</span> <span class="amenities__item__text ellipsis">
                Parking</span>
            </div>
            <div class="amenities__item">
                <span class="amenities__item__icon" data-icon="12228">{property.pipedGas}</span><span class="amenities__item__text ellipsis">
                Piped Gas</span>
            </div>
        </div>
        
        <div class="moreDetailContainer">
            <div class="featureHead">
                📍 Location
            </div>
            <div class="proMoreFeature">
                <div class="proAddressDetail">
                    <div class="proData">Address : <strong>{property.address}</strong></div>
                    <div class="proData">City : <strong>{property.city}</strong></div>
                    <div class="proData">Zip Code :  <strong>{property.zipCode}</strong></div>
                </div>
            </div>
            <div class="featureHead" style="margin-top:1rem">
                🧩 Other Details 
            </div>
            <table>
                <tbody>
                    <tr class="proData">
                        <td class="proData">Year Build </td><td> : <strong>&nbsp;Year &nbsp;{property.yearBuild}</strong></td>
                        <td class="proData">Facing Direction </td><td> : &nbsp;<strong>{property.facingDirection} </strong></td>
                    </tr>
                    <tr class="proData">
                        <td class="proData">Booking Fee </td><td> : &nbsp;<strong>₹ &nbsp;{property.bookingfee}</strong></td>
                        <td class="proData">Price </td><td> : &nbsp;<strong>₹ &nbsp;{property.price}</strong></td>
                    </tr>
                </tbody>
        </table>
       
        </div>
        <template lwc:if={mapMarkers}>
            <div>
                <lightning-map map-markers={mapMarkers} class="locationMap slds-p-bottom_none"> </lightning-map>
            </div>
        </template>    
    </div>
    <div> 
        <div class="loan-calculator">
            <div class="top">
                <!-- h2>Mortgage Calculator</h2> -->   
                <div class="title" style="font-size:22px;"><Span><lightning-icon icon-name='utility:moneybag' alternative-text='moneybag' size='small' title='moneybag'></lightning-icon></Span> Calculate Your Mortgage Payment  </div>      
                <form action="#">
                    <div class="group">
                        <div class="title">Amount (₹)</div>
                        <input type="number" name="amount" value={amount} class="loan-amount calculatorInput" onchange={loanDataHandle} placeholder="Total amount">
                    </div>
                    
                    <div class="group">
                        <div class="title">Down payment (₹)</div>
                        <input type="number" name="downPayment" value={downPayment} onchange={loanDataHandle} class="down-payment calculatorInput" placeholder="Down Payment">
                    </div>
                    
                    <div class="group">
                        <div class="title">Interest Rate (%)</div>
                        <input type="number" name="InterestRate"   value={InterestRate} onchange={loanDataHandle} class="interest-rate calculatorInput" placeholder="Interest rate in %">
                    </div>
                    
                    <div class="group">
                        <div class="title">Tenure (Months)</div>
                        <input type="number" name="tenure"  value={tenure} onchange={loanDataHandle} class="loan-tenure calculatorInput" placeholder="Tenure in months">
                    </div>
                </form>
            </div>
            <div class="myBtn">
                <button class="calculate-btn controlButtons" onclick={calculateMortgaged}>Calculate</button>
                <button class="resetBtn controlButtons" onclick={resetFields}>Reset</button>
            </div>
            <template lwc:if={calculateMortgagedFlag}>
                <div class="result">
                    <div class="left">
                        <div class="loan-emi">
                            <h3>Loan EMI</h3>
                            <div class="value">{emi}</div>
                        </div>

                        <div class="total-interest">
                            <h3>Total Interest Payable</h3>
                            <div class="value">{totalInterest}</div>
                        </div>

                        <div class="total-amount">
                            <h3>Total Amount</h3>
                            <div class="value">{totalAmount}</div>
                        </div>

                        <!-- <button class="calculate-btn">Calculate</button>
                        <button class="resetBtn">Reset</button> -->
                    </div>

                    <div class="right">
                        <canvas id="myChart" width="388" height="387" style="display: block; box-sizing: border-box; height: 309.6px; width: 310.4px;"></canvas>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div class="enquiryContainer">
        <div class="enquiryHeading">Get in Touch </div>
        <div class="enquiryInnerContainer" style="margin:0 10rem">
            <div class="enquiryForm">
                <div>
                    <lightning-input type="text" label="Name" required="true" placeholder="Tony Stark" value={enquiryName} name="enquiryName" message-when-value-missing="👋 Name is required for enquiry" onchange={handleEqInputChange} data-id="name"></lightning-input>
                </div>
                <div>
                    <lightning-input  label="Email" required="true" placeholder="xyz@gmail.com" type="email" value={enquiryEmail} name="enquiryEmail" message-when-value-missing="📩 Email-ID is required input for enquiry to perform" onchange={handleEqInputChange} data-id="email"></lightning-input>
                </div>
                <div>
                    <lightning-input label="Phone Number" placeholder="+91-XXXXX-XXXXX" required="true" type="tel" value={enquiryPhone} name="enquiryPhone" max-length="10" min-length="10" message-when-value-missing="📞 Phone number is required" onchange={handleEqInputChange} data-id="phone"></lightning-input>
                </div>
                <div>
                    <lightning-textarea class="textAreaBody" placeholder="Describe your queries and interest regarding the property..." value={enquiryMessage} label="Message" name="enquiryMessage" maxlength="300" onchange={handleEqInputChange} data-id="message"></lightning-textarea>
                </div>
                <div class="enquiryBtn">
                    <button onclick={handleEqSubmit} class="enquirySubmit">Submit</button>
                </div>    
            </div>
        </div>
    </div>
    </div>
    
    <!-- reference for Mortgage Calculator  : https://briskmindssoftwaresoluti-fb-dev-ed.develop.my.site.com/RealEstateManagementAssignment/s/propertydetail?propertyId=a09dM000003N9VRQA0-->
  
</template>
